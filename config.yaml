# Urban Arrow deal tracker — settings you're likely to change.

home:
  name: "'s-Hertogenbosch"
  postcode: "5211"          # used for Marktplaats distance sorting
  lat: 51.6978
  lon: 5.3037
  max_distance_km: 250      # listings further away are still stored, but hidden by default on the site

marktplaats:
  enabled: true
  host: "https://www.marktplaats.nl"
  queries: ["urban arrow", "urbanarrow"]
  # Search all categories: that already includes the bike category ("Fietsen en Brommers" = 445)
  # and also catches sellers who picked the wrong one. Set a number to limit it to one category.
  category_l1: null
  page_size: 100
  max_pages_per_query: 12   # 1,200 results per search; "urban arrow" currently has ~1,000
  fetch_details: true       # open each new listing once to read the full description
  max_detail_fetches_per_run: 400
  delay_seconds: [2.0, 5.0] # random pause between requests (be polite)

# Belgian sister site (same platform). Off by default; Antwerp is ~1h from Den Bosch.
tweedehands_be:
  enabled: false
  host: "https://www.2dehands.be"
  queries: ["urban arrow"]
  category_l1: 0
  max_pages_per_query: 2

# Product pages of shops that sell NEW Urban Arrows. Any page with schema.org
# Product data (almost every web shop) works. Add one URL per model you care about.
# Example:
#   - url: "https://www.example-fietsenwinkel.nl/urban-arrow-family-cargo-line"
#     variant: family
new_bike_pages: []

# Approximate Dutch list prices (adviesprijs) for a current new bike, in EUR.
# Only used as a starting point for the price model when there's too little
# second-hand data. These are rough estimates — check urbanarrow.com and adjust.
msrp_estimate:
  family: 7500
  shorty: 6900
  tender: 8500
  cargo: 8000
  other: 7000

llm:
  # Which backend extracts structured details from listing text:
  #   auto   -> Claude API if ANTHROPIC_API_KEY is set, else Claude Code CLI if
  #             CLAUDE_CODE_OAUTH_TOKEN is set (uses your Pro subscription), else rules only
  #   api | cli | none
  backend: auto
  model: claude-haiku-5-5   # fast and cheap, very good at this kind of extraction
  batch_size: 10            # listings per request
  parallel_requests: 4
  max_listings_per_run: 1000 # safety cap; normally only new or changed listings are sent

alerts:
  # Email alerts: set GMAIL_ADDRESS and GMAIL_APP_PASSWORD as repository secrets (see README)
  min_deal_pct: 10          # email when a listing is at least this % below fair price
  max_distance_km: 120
  min_confidence: medium    # skip listings with too little info to price reliably
  notify_price_drops: true
