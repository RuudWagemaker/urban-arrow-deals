name: Daily Urban Arrow scan

on:
  schedule:
    - cron: "23 5,11,17 * * *"   # three times a day: ~07:23, 13:23, 19:23 Dutch time (an hour earlier in summer)
  workflow_dispatch: {}           # "Run workflow" button in the Actions tab
  push:                           # also run right after a code change
    branches: [main]
    paths: ["uatracker/**", "config.yaml", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Amsterdam   # "today" means a Dutch day
      # Pick ONE way to give Claude access (see README):
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # Pro/Max subscription
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}              # or pay-per-use API key
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}                            # phone alerts via ntfy (see README)
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}                      # or email alerts (see README)
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}                                # optional, defaults to GMAIL_ADDRESS
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always start from the latest data, even if this run waited in the queue

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install Claude Code (subscription mode)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && env.ANTHROPIC_API_KEY == ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Scan, analyse, build site
        run: python -m uatracker run

      - name: Save collected data
        run: |
          git config user.name "ua-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u '+%F %H:%M')"
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
