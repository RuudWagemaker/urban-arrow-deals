name: Publish site

# Website-only changes: rebuild the site from the stored data and publish it,
# without scanning Marktplaats or using Claude.
on:
  push:
    branches: [main]
    paths: ["web/**", "uatracker/site.py", ".github/workflows/site.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Its own queue: sharing the scan's queue made GitHub cancel a scan that was
  # triggered at the same moment as a publish.
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m uatracker build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
